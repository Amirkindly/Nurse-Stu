name: Build Nurse Stu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and find project
        run: |
          echo "Files in repo:"
          find . -type f -not -path "./.git/*" | head -50
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | sort -V | tail -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no zip file found in the repo"
            exit 1
          fi
          echo "Using zip: $ZIP"
          mkdir -p src_unzipped
          unzip -q "$ZIP" -x '__MACOSX/*' -d src_unzipped
          SETTINGS=$(find src_unzipped -name "settings.gradle.kts" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk dist/Nurse-Stu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nurse-Stu-apk
          path: dist/Nurse-Stu.apk
