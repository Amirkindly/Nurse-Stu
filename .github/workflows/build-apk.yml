
name: Build Nurse Stu APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# لغو بیلدهای قدیمی در صورت push جدید
concurrency:
  group: nurse-stu-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Nurse Stu Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # اگر پروژه داخل ZIP باشد، آن را استخراج می‌کند
      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src_unzipped
          i=0

          while IFS= read -r -d '' zipfile; do
            i=$((i + 1))
            echo "Extracting: $zipfile"

            mkdir -p "src_unzipped/$i"
            unzip -q -o "$zipfile" \
              -x '__MACOSX/*' '*/.DS_Store' \
              -d "src_unzipped/$i"
          done < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './src_unzipped/*' \
              -print0
          )

      # پیدا کردن ریشه واقعی پروژه اندروید
      - name: Locate Nurse Stu project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=""

          for ROOT in . src_unzipped; do
            [ -d "$ROOT" ] || continue

            SETTINGS=$(
              find "$ROOT" \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -not -path '*/.git/*' \
                -not -path '*/build/*' \
                -print -quit
            )

            if [ -n "$SETTINGS" ]; then
              break
            fi
          done

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found."
            echo "Upload the Nurse Stu project or its ZIP to the repository."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found at app/."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          add-job-summary: on-failure

      # استفاده از Wrapper در صورت وجود
      - name: Build Nurse Stu Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --console=plain \
              --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --console=plain \
              --stacktrace
          fi

      # پیدا کردن و آماده‌سازی APK
      - name: Collect Nurse Stu APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          APK=$(find "$APK_DIR" -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Nurse Stu APK was not generated."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/Nurse-Stu-debug.apk

          APK_SIZE=$(du -h dist/Nurse-Stu-debug.apk | cut -f1)

          {
            echo "## Nurse Stu Build"
            echo ""
            echo "- Status: Success"
            echo "- File: Nurse-Stu-debug.apk"
            echo "- Size: $APK_SIZE"
            echo "- Build type: Debug"
          } >> "$GITHUB_STEP_SUMMARY"

      # آپلود فایل برای دانلود
      - name: Upload Nurse Stu APK
        uses: actions/upload-artifact@v4
        with:
          name: Nurse-Stu-debug-apk
          path: dist/Nurse-Stu-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
